        .vLoadList li {

        .pBd {

            overflow: hidden;

        .c1{background:#f25022}.c2{background:#7fba00}.c3{background:#00a4ef}.c4{background:#ffb900}
        .dRew {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), #004c8c);
            transition: width 250ms cubic-bezier(.2,.9,.2,1);
        }
        #status {
            margin-top: 10px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
        }
        .vLoadList {
            display: grid;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        /* vLoadList animation initial state */
        .vLoadList li {
            opacity: 0;
            transform: translateX(-10px) scale(0.995);
            transition: opacity 360ms ease, transform 360ms cubic-bezier(.2,.9,.2,1);
            display: flex;
            justify-content: center;
            text-align: center;
        }
        .vLoadList li.visible {

            transform: translateX(0) scale(1);
        }

            color: #9aa4b2;
            text-align: center;
